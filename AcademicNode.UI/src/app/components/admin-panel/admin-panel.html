<div class="container mt-5">
  <h2 class="mb-4 text-warning">Panou de Administrare</h2>

  <div class="row">
    <table class="table table-dark table-striped">
      <thead>
        <tr>
          <th>Username</th>
          <th>Roluri Active</th>
          <th>Acțiuni</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users; track user.username) {
        <tr>
          <td>{{user.username}}</td>
          <td>{{user.roles}}</td>
          <td>
            <button (click)="openEditPanel(user)" class="btn btn-info btn-sm">Editează Roluri</button>
          </td>
        </tr>
        }
      </tbody>
    </table>

    @if (editingUser) {
    <div class="card bg-dark text-white mt-4 p-4 border border-info">
      <h4>Modifică rolurile pentru <span class="text-warning">{{editingUser.username}}</span></h4>

      <div class="mt-3">
        @for (role of availableRoles; track role) {
        <div class="form-check form-check-inline me-4">
          <input class="form-check-input" type="checkbox"
                 [checked]="selectedRoles.includes(role)"
                 (change)="toggleRole(role)"
                 [id]="role">
          <label class="form-check-label" [for]="role">{{role}}</label>
        </div>
        }
      </div>

      <div class="mt-4">
        <button (click)="saveRoles()" class="btn btn-success me-2">Salvează Modificările</button>
        <button (click)="cancelEdit()" class="btn btn-secondary">Anulează</button>
      </div>
    </div>
    }
  </div>
</div>
