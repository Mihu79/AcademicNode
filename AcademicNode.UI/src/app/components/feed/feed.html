<div class="p-4" style="max-width: 800px; margin: 0 auto;">
  <h1 class="mb-4 text-center">Flux Postări</h1>

  <div class="mb-4 custom-search-wrapper">
    <i class="pi pi-search custom-search-icon"></i>
    <input type="text" pInputText placeholder="Caută după titlu sau autor..." [(ngModel)]="searchText" (ngModelChange)="filterPosts()" class="w-full custom-search-input">
  </div>
  <br />

  <div class="action-bar text-right mb-4 flex justify-content-end gap-2">
    <p-button *ngIf="isNormalUser()" label="Solicită Acces Academic" icon="pi pi-id-card" styleClass="btn-request-role" (onClick)="showRequestDialog()"></p-button>

    <p-button *ngIf="canInteract()" label="Profilul Meu" icon="pi pi-user" [routerLink]="['/members', currentUser?.username]"></p-button>
    <p> </p>
    <p-button *ngIf="canInteract()" label="Postare Nouă" icon="pi pi-plus" (onClick)="showAddDialog()"></p-button>
  </div>

  <div *ngIf="visiblePosts.length === 0" class="text-center p-5">
    <p-card><h3>Nu există postări momentan.</h3></p-card>
  </div>

 <div *ngFor="let post of visiblePosts" class="post-item mb-3">
    <app-post-card [post]="post" [currentUser]="currentUser" [userRoles]="userRoles" (edit)="showEditDialog($event)" (delete)="deletePost($event)"></app-post-card>
  </div>

  <p-dialog [header]="isEditMode ? 'Editează Postarea' : 'Postare Nouă'" [(visible)]="visible" [modal]="true" [style]="{ width: '50vw' }" [draggable]="false" [resizable]="false">
    <div class="flex flex-column gap-3">

      <div class="flex flex-column gap-2">
        <label>Titlu</label>
        <input pInputText [(ngModel)]="postData.title" />
      </div>

      <div class="flex flex-column gap-2">
        <label>Conținut / Descriere curs</label>
        <textarea pInputText [(ngModel)]="postData.content" rows="5"></textarea>
      </div>

      <div class="flex flex-column gap-2">
        <label>{{ isEditMode ? 'Schimbă fișierul atașat (Opțional)' : 'Alege un fișier (Poză sau PDF)' }}</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*,application/pdf" class="p-inputtext">

        <div *ngIf="previewUrl && !isPdfSelected" class="mt-3 text-center">
          <p class="mb-2" style="color: var(--neon-cyan); font-size: 0.8rem;">Preview Imagine:</p>
          <img [src]="previewUrl" class="preview-image" style="max-height: 200px; border-radius: 8px;">
        </div>

        <div *ngIf="isPdfSelected" class="pdf-display-box mt-3">
          <i class="pi pi-file-pdf pdf-icon" style="font-size: 2rem;"></i>
          <p class="mt-2" style="color: var(--neon-cyan);">Document PDF atașat / selectat.</p>
        </div>
      </div>

      <div class="flex justify-content-end mt-3">
        <p-button [label]="isEditMode ? 'Salvează' : 'Publică'" icon="pi pi-check" (onClick)="submitPost()"></p-button>
      </div>

    </div>
  </p-dialog>

  <p-dialog header="Solicită Acces Academic" [(visible)]="requestDialogVisible" [modal]="true" [style]="{ width: '40vw' }" [draggable]="false" [resizable]="false">
    <div class="flex flex-column gap-3">
      <p style="color: var(--text-secondary); line-height: 1.5;">
        Contul tău are drepturi limitate (Vizitator). Alege rolul pe care îl dorești și lasă un mesaj administratorului pentru a-ți valida contul.
      </p>

      <div class="flex flex-column gap-2">
        <label>Rol Dorit</label>
        <select class="custom-request-input" [(ngModel)]="requestData.requestedRole" style="cursor: pointer;">
          <option value="Student">Sunt Student</option>
          <option value="Professor">Sunt Profesor</option>
        </select>
      </div>

      <div class="flex flex-column gap-2">
        <label>Mesaj / Justificare</label>
        <textarea class="custom-request-input" pInputText [(ngModel)]="requestData.message" rows="4" placeholder="Ex: Bună, sunt student la specializarea CTI, anul 3. Vă rog să îmi aprobați contul."></textarea>
      </div>

      <div class="flex justify-content-end mt-3">
        <p-button label="Trimite Cererea" icon="pi pi-send" severity="help" (onClick)="submitRoleRequest()"></p-button>
      </div>
    </div>
  </p-dialog>
</div>
