<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
  <p-card header="Setează o nouă parolă" [style]="{ width: '400px' }">
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <p style="color: #bbb; font-size: 0.9rem; margin: 0;">
        Introdu noua parolă pentru contul tău. Asigură-te că este o parolă puternică (litere, cifre, simboluri).
      </p>

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <label for="newPassword">Parolă nouă</label>
        <p-password id="newPassword" [(ngModel)]="newPassword" [toggleMask]="true" [feedback]="true" promptLabel="Introdu o parolă" weakLabel="Slabă" mediumLabel="Medie" strongLabel="Puternică"></p-password>
      </div>

      <p-button label="Salvează parola" icon="pi pi-check" severity="success" (onClick)="submitNewPassword()"></p-button>

    </div>
  </p-card>
</div>
